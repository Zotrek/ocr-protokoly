<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OCR protokołów</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0f1419;
        --bg-elevated: #1a2332;
        --surface: #243044;
        --border: #334155;
        --text: #f1f5f9;
        --text-muted: #94a3b8;
        --accent: #38bdf8;
        --accent-dim: #0ea5e9;
        --accent-glow: rgba(56, 189, 248, 0.22);
        --success: #34d399;
        --radius: 14px;
        --radius-sm: 10px;
        --shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        --font: "DM Sans", system-ui, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, monospace;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: #e8eef4;
          --bg-elevated: #f8fafc;
          --surface: #ffffff;
          --border: #cbd5e1;
          --text: #0f172a;
          --text-muted: #64748b;
          --accent: #0284c7;
          --accent-dim: #0369a1;
          --accent-glow: rgba(2, 132, 199, 0.12);
          --shadow: 0 12px 40px rgba(15, 23, 42, 0.08);
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: var(--font);
        font-size: 1rem;
        line-height: 1.55;
        color: var(--text);
        background: var(--bg);
        background-image: radial-gradient(ellipse 120% 80% at 50% -20%, var(--accent-glow), transparent 50%);
      }

      .app {
        max-width: 40rem;
        margin: 0 auto;
        padding: 2rem 1.25rem 3rem;
      }

      .hero {
        margin-bottom: 1.75rem;
      }

      .badge {
        display: inline-block;
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
        background: var(--accent-glow);
        border: 1px solid var(--border);
        padding: 0.2rem 0.55rem;
        border-radius: 6px;
        margin-bottom: 0.65rem;
      }

      h1 {
        font-size: clamp(1.65rem, 4vw, 2rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0 0 0.5rem;
        line-height: 1.2;
      }


      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.25rem 1.35rem;
        margin-bottom: 1rem;
        box-shadow: var(--shadow);
      }

      .panel h2 {
        font-size: 0.85rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-muted);
        margin: 0 0 0.75rem;
      }

      .btn-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        width: 100%;
        padding: 0.9rem 1.25rem;
        font-family: var(--font);
        font-size: 1rem;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(165deg, var(--accent) 0%, var(--accent-dim) 100%);
        border: none;
        border-radius: var(--radius-sm);
        cursor: pointer;
        box-shadow: 0 4px 14px var(--accent-glow);
        transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
      }

      .btn-primary:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 6px 20px var(--accent-glow);
      }

      .btn-primary:active:not(:disabled) {
        transform: translateY(0);
      }

      .btn-primary:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .btn-secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        margin-top: 0.65rem;
        padding: 0.65rem 1rem;
        font-family: var(--font);
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--text-muted);
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        cursor: pointer;
        transition: opacity 0.15s ease, border-color 0.15s ease;
      }

      .btn-secondary:hover:not(:disabled) {
        border-color: var(--accent-dim);
        color: var(--text);
      }

      .btn-secondary:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .options-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem 1rem;
        margin-top: 0.85rem;
        font-size: 0.88rem;
        color: var(--text-muted);
      }

      .options-row label {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        cursor: pointer;
        user-select: none;
      }

      .ocr-threshold-block {
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
        flex: 1 1 14rem;
        min-width: 0;
      }

      .ocr-threshold-block > label[for="inpOcrMin"] {
        cursor: help;
      }


      .options-row input[type="checkbox"] {
        width: 1rem;
        height: 1rem;
        accent-color: var(--accent-dim);
      }

      .options-row input[type="number"] {
        width: 3.25rem;
        padding: 0.25rem 0.35rem;
        font-family: var(--mono);
        font-size: 0.85rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg-elevated);
        color: var(--text);
      }

      .btn-primary svg {
        flex-shrink: 0;
        opacity: 0.95;
      }


      .status-row {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      #status {
        font-size: 0.9rem;
        color: var(--text);
        min-height: 1.4em;
        padding: 0.65rem 0.85rem;
        background: var(--bg-elevated);
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
      }

      progress {
        width: 100%;
        height: 0.45rem;
        border: none;
        border-radius: 999px;
        overflow: hidden;
        background: var(--bg-elevated);
      }

      progress::-webkit-progress-bar {
        background: var(--bg-elevated);
        border-radius: 999px;
      }

      progress::-webkit-progress-value {
        background: linear-gradient(90deg, var(--accent), var(--accent-dim));
        border-radius: 999px;
      }

      progress::-moz-progress-bar {
        background: linear-gradient(90deg, var(--accent), var(--accent-dim));
        border-radius: 999px;
      }

      .kbd-hint {
        margin: 0;
        font-size: 0.8rem;
        color: var(--text-muted);
      }

      kbd {
        font-family: var(--mono);
        font-size: 0.78em;
        padding: 0.12em 0.4em;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--bg-elevated);
      }

      #results {
        display: none;
        flex-wrap: wrap;
        gap: 0.5rem 1.1rem;
        padding: 0.6rem 0.85rem;
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        font-size: 0.82rem;
      }

      #results.visible {
        display: flex;
      }

      .res-chip {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.25rem 0.6rem;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 600;
        white-space: nowrap;
      }

      .res-chip.ok   { background: #14532d22; color: #4ade80; border: 1px solid #4ade8044; }
      .res-chip.warn { background: #78350f22; color: #fbbf24; border: 1px solid #fbbf2444; }
      .res-chip.err  { background: #7f1d1d22; color: #f87171; border: 1px solid #f8717144; }
      .res-chip.tot  { background: var(--bg); color: var(--text-muted); border: 1px solid var(--border); }

      #folderInfo {
        display: none;
        align-items: center;
        gap: 0.5rem;
        padding: 0.45rem 0.75rem;
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        font-size: 0.82rem;
        color: var(--text-muted);
        overflow: hidden;
      }

      #folderInfo.visible { display: flex; }

      #folderInfo svg { flex-shrink: 0; opacity: 0.6; }

      #folderName {
        font-family: var(--mono);
        font-size: 0.8rem;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

    </style>
  </head>
  <body>
    <div class="app">
      <header class="hero">
        <span class="badge">Wersja POC</span>
        <h1>OCR protokołów</h1>
      </header>

      <section class="panel">
        <button type="button" class="btn-primary" id="btnDir" aria-label="Wybierz folder z plikami PDF">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
          </svg>
          Wybierz folder z PDF
        </button>
        <button type="button" class="btn-secondary" id="btnStop" disabled>Przerwij batch</button>
        <div id="folderInfo" aria-live="polite" aria-label="Wybrany folder">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          </svg>
          <span id="folderName"></span>
        </div>
        <div class="options-row" role="group" aria-label="Opcje skanowania folderu">
          <label>
            <input type="checkbox" id="chkRecurse" />
            Szukaj PDF w podfolderach (pomijane: <code style="font-family: var(--mono); font-size: 0.8em">done</code>,
            <code style="font-family: var(--mono); font-size: 0.8em">problematyczne</code>)
          </label>
          <div class="ocr-threshold-block">
            <label
              for="inpOcrMin"
              title="Skala 0–100 (pewność Tesseract): dla pliku używana jest najniższa wartość z przebiegów OCR. Poniżej progu → folder problematyczne, nawet przy poprawnym tekście. Przy PDF z samą warstwą tekstową (bez OCR) próg nie obowiązuje. Dłuższy opis: najedź kursorem na etykietę „Próg OCR”."
            >
              Próg OCR
            </label>
            <input
              type="number"
              id="inpOcrMin"
              min="0"
              max="100"
              step="1"
              value="55"
              title="Skala 0–100 (pewność Tesseract): dla pliku używana jest najniższa wartość z przebiegów OCR. Poniżej progu → folder problematyczne, nawet przy poprawnym tekście. Przy PDF z samą warstwą tekstową (bez OCR) próg nie obowiązuje. Przy OCR ROI str. 1 możesz ustawić osobne progi poniżej (puste = jak próg ogólny)."
            />
          </div>
        </div>
      </section>

      <section class="panel status-row">
        <div id="status" aria-live="polite">Oczekuję na start.</div>
        <progress id="prog" max="100" value="0"></progress>
        <div id="results" role="status" aria-live="polite" aria-label="Podsumowanie batcha"></div>
        <p class="kbd-hint">Podczas obróbki: <kbd>Esc</kbd> — przerwij batch (jak przycisk „Przerwij”).</p>
      </section>

    </div>

    <input type="file" id="inputDir" multiple hidden webkitdirectory mozdirectory directory />

    <script type="module" src="./app.mjs"></script>
  </body>
</html>
