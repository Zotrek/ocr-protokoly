<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OCR protokołów</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0f1419;
        --bg-elevated: #1a2332;
        --surface: #243044;
        --border: #334155;
        --text: #f1f5f9;
        --text-muted: #94a3b8;
        --accent: #38bdf8;
        --accent-dim: #0ea5e9;
        --accent-glow: rgba(56, 189, 248, 0.22);
        --success: #34d399;
        --radius: 14px;
        --radius-sm: 10px;
        --shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        --font: "DM Sans", system-ui, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, monospace;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: #e8eef4;
          --bg-elevated: #f8fafc;
          --surface: #ffffff;
          --border: #cbd5e1;
          --text: #0f172a;
          --text-muted: #64748b;
          --accent: #0284c7;
          --accent-dim: #0369a1;
          --accent-glow: rgba(2, 132, 199, 0.12);
          --shadow: 0 12px 40px rgba(15, 23, 42, 0.08);
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: var(--font);
        font-size: 1rem;
        line-height: 1.55;
        color: var(--text);
        background: var(--bg);
        background-image: radial-gradient(ellipse 120% 80% at 50% -20%, var(--accent-glow), transparent 50%);
      }

      .app {
        max-width: 40rem;
        margin: 0 auto;
        padding: 2rem 1.25rem 3rem;
      }

      .hero {
        margin-bottom: 1.75rem;
      }

      .badge {
        display: inline-block;
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
        background: var(--accent-glow);
        border: 1px solid var(--border);
        padding: 0.2rem 0.55rem;
        border-radius: 6px;
        margin-bottom: 0.65rem;
      }

      h1 {
        font-size: clamp(1.65rem, 4vw, 2rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0 0 0.5rem;
        line-height: 1.2;
      }

      .lead {
        margin: 0;
        color: var(--text-muted);
        font-size: 0.95rem;
        max-width: 36ch;
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.25rem 1.35rem;
        margin-bottom: 1rem;
        box-shadow: var(--shadow);
      }

      .panel h2 {
        font-size: 0.85rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-muted);
        margin: 0 0 0.75rem;
      }

      .btn-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        width: 100%;
        padding: 0.9rem 1.25rem;
        font-family: var(--font);
        font-size: 1rem;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(165deg, var(--accent) 0%, var(--accent-dim) 100%);
        border: none;
        border-radius: var(--radius-sm);
        cursor: pointer;
        box-shadow: 0 4px 14px var(--accent-glow);
        transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
      }

      .btn-primary:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 6px 20px var(--accent-glow);
      }

      .btn-primary:active:not(:disabled) {
        transform: translateY(0);
      }

      .btn-primary:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .btn-primary svg {
        flex-shrink: 0;
        opacity: 0.95;
      }

      .hint {
        margin: 0.85rem 0 0;
        font-size: 0.85rem;
        color: var(--text-muted);
        text-align: center;
        line-height: 1.4;
      }

      .status-row {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      #status {
        font-size: 0.9rem;
        color: var(--text);
        min-height: 1.4em;
        padding: 0.65rem 0.85rem;
        background: var(--bg-elevated);
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
      }

      progress {
        width: 100%;
        height: 0.45rem;
        border: none;
        border-radius: 999px;
        overflow: hidden;
        background: var(--bg-elevated);
      }

      progress::-webkit-progress-bar {
        background: var(--bg-elevated);
        border-radius: 999px;
      }

      progress::-webkit-progress-value {
        background: linear-gradient(90deg, var(--accent), var(--accent-dim));
        border-radius: 999px;
      }

      progress::-moz-progress-bar {
        background: linear-gradient(90deg, var(--accent), var(--accent-dim));
        border-radius: 999px;
      }

      #log {
        white-space: pre-wrap;
        word-break: break-word;
        font-family: var(--mono);
        font-size: 0.75rem;
        line-height: 1.5;
        background: var(--bg-elevated);
        color: var(--text);
        padding: 1rem;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        max-height: 22rem;
        overflow: auto;
        margin: 0;
      }

    </style>
  </head>
  <body>
    <div class="app">
      <header class="hero">
        <span class="badge">Wersja POC</span>
        <h1>OCR protokołów</h1>
        <p class="lead">
          Wybierz <strong>folder</strong> z plikami PDF — przetwarzanie w kolejce, jeden silnik OCR (polski).
        </p>
      </header>

      <section class="panel">
        <button type="button" class="btn-primary" id="btnDir" aria-label="Wybierz folder z plikami PDF">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
          </svg>
          Wybierz folder z PDF
        </button>
        <p class="hint">Przetwarzane są wyłącznie pliki <code style="font-family: var(--mono); font-size: 0.85em">.pdf</code> z tego katalogu (bez podfolderów w tym POC).</p>
      </section>

      <section class="panel status-row">
        <div id="status" aria-live="polite">Oczekuję na start.</div>
        <progress id="prog" max="100" value="0"></progress>
      </section>

      <section class="panel">
        <h2>Podgląd rozpoznanego tekstu</h2>
        <pre id="log"></pre>
      </section>
    </div>

    <input type="file" id="inputDir" multiple hidden webkitdirectory directory />

    <script type="module">
      import Tesseract from "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/+esm";
      import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/+esm";
      import { parseProtocolText } from "./protocol_parse.mjs";

      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs";

      const el = {
        status: document.getElementById("status"),
        prog: document.getElementById("prog"),
        log: document.getElementById("log"),
        btnDir: document.getElementById("btnDir"),
        inputDir: document.getElementById("inputDir"),
      };

      const STATUS_IDLE = "Oczekuję na start.";

      /** @type {import('tesseract.js').Worker | null} */
      let ocrWorker = null;
      let busy = false;

      function setStatus(text) {
        el.status.textContent = text;
      }

      function appendLog(chunk) {
        el.log.textContent += chunk;
        el.log.scrollTop = el.log.scrollHeight;
      }

      async function ensureOcrWorker() {
        if (ocrWorker) return ocrWorker;
        setStatus("Inicjalizacja OCR (pierwsze uruchomienie może trwać dłużej — pobierany jest model języka)…");
        ocrWorker = await Tesseract.createWorker("pol", 1, {
          logger(m) {
            if (m.status === "recognizing text" && typeof m.progress === "number") {
              setStatus(`OCR strony… ${Math.round(m.progress * 100)}%`);
            }
          },
        });
        return ocrWorker;
      }

      /**
       * Tekst z warstwy PDF (np. eksport Word) — bez OCR. Na skanach zwykle pusty → wtedy pełnostronicowy OCR.
       * @param {import('pdfjs-dist').PDFPageProxy} page
       */
      async function extractTextNative(page) {
        const tc = await page.getTextContent();
        const items = tc.items
          .filter((it) => "str" in it && it.str.trim())
          .map((it) => {
            const ty = it.transform[5];
            const tx = it.transform[4];
            return { str: it.str, tx, ty };
          });
        items.sort((a, b) => {
          if (Math.abs(a.ty - b.ty) < 2.5) return a.tx - b.tx;
          return b.ty - a.ty;
        });
        const lines = [];
        let line = [];
        let lastTy = /** @type {number | null} */ (null);
        for (const it of items) {
          if (lastTy !== null && Math.abs(it.ty - lastTy) > 2.5) {
            lines.push(line.join(" "));
            line = [];
          }
          line.push(it.str);
          lastTy = it.ty;
        }
        if (line.length) lines.push(line.join(" "));
        return lines.join("\n");
      }

      /** Heurystyka: czy wygląda na treść protokołu z szablonu (nie pusty / nie „śmieciowy” fragment). */
      function looksLikeProtocolText(s) {
        const t = s.toLowerCase();
        return (
          s.trim().length > 120 &&
          t.includes("zlecenie") &&
          t.includes("transportowe") &&
          t.includes("przewoźnik") &&
          t.includes("lista") &&
          t.includes("plomb")
        );
      }

      /**
       * @param {import('pdfjs-dist').PDFPageProxy} page
       * @param {import('tesseract.js').Worker} worker
       */
      async function ocrPageCanvas(page, worker) {
        const scale = 2;
        const viewport = page.getViewport({ scale });
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        if (!ctx) throw new Error("Brak kontekstu 2D canvas");
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        await page.render({ canvasContext: ctx, viewport }).promise;
        const {
          data: { text },
        } = await worker.recognize(canvas);
        return text;
      }

      /**
       * @param {File} file
       * @param {import('tesseract.js').Worker} worker
       * @returns {Promise<{ text: string, pageSources: string[] }>}
       */
      async function ocrPdfFile(file, worker) {
        const data = new Uint8Array(await file.arrayBuffer());
        const pdf = await pdfjsLib.getDocument({ data }).promise;
        const parts = [];
        /** @type {string[]} */
        const pageSources = [];
        for (let p = 1; p <= pdf.numPages; p++) {
          setStatus(`${file.name}: strona ${p}/${pdf.numPages}`);
          const page = await pdf.getPage(p);
          let text = await extractTextNative(page);
          let source = "warstwa PDF";
          const nativeLen = text.trim().length;
          const ocrNeeded =
            nativeLen === 0 || (p === 1 && !looksLikeProtocolText(text));
          if (ocrNeeded) {
            source = "OCR (skan lub brak tekstu)";
            text = await ocrPageCanvas(page, worker);
          }
          parts.push(text);
          pageSources.push(source);
        }
        return { text: parts.join("\n\n"), pageSources };
      }

      /**
       * @param {File[]} files
       */
      async function runQueue(files) {
        if (busy) return;
        const list = files.filter((f) => f.name.toLowerCase().endsWith(".pdf"));
        if (list.length === 0) {
          setStatus("W folderze nie znaleziono plików PDF.");
          return;
        }
        list.sort((a, b) => a.name.localeCompare(b.name, "pl"));
        busy = true;
        el.btnDir.disabled = true;
        el.log.textContent = "";
        el.prog.max = list.length;
        el.prog.value = 0;
        setStatus(`Znaleziono ${list.length} plik(ów) PDF. Start…`);

        try {
          const worker = await ensureOcrWorker();
          for (let i = 0; i < list.length; i++) {
            const file = list[i];
            try {
              const { text: fullText, pageSources } = await ocrPdfFile(file, worker);
              appendLog(`═══ ${file.name} ═══\n`);
              pageSources.forEach((src, idx) => {
                appendLog(`  strona ${idx + 1}: ${src}\n`);
              });
              const parsed = parseProtocolText(fullText);
              appendLog(
                `── Pola (parser) ──\n` +
                  `zlecenie: ${parsed.numer_zlecenia || "—"}\n` +
                  `przewoźnik: ${parsed.przewoznik ? parsed.przewoznik.slice(0, 200) + (parsed.przewoznik.length > 200 ? "…" : "") : "—"}\n` +
                  `plomby (${parsed.plomby.length}): ${parsed.plomby.join(", ") || "—"}\n` +
                  (parsed.uwagi_parse.length ? `uwagi parsera: ${parsed.uwagi_parse.join(", ")}\n` : "")
              );
              const preview = fullText.slice(0, 2500);
              appendLog(`── Pełny tekst (fragment) ──\n${preview}${fullText.length > 2500 ? "\n… [ucięto]\n" : "\n"}\n`);
            } catch (err) {
              const msg = err instanceof Error ? err.message : String(err);
              appendLog(`═══ ${file.name} ═══\nBŁĄD: ${msg}\n\n`);
            }
            el.prog.value = i + 1;
            setStatus(`Przetworzono ${i + 1} / ${list.length}`);
          }
          setStatus("Gotowe.");
        } finally {
          busy = false;
          el.btnDir.disabled = false;
        }
      }

      el.btnDir.addEventListener("click", async () => {
        const fsa = typeof window.showDirectoryPicker === "function";
        if (fsa) {
          try {
            /** @type {FileSystemDirectoryHandle} */
            const dir = await window.showDirectoryPicker({ mode: "read" });
            const files = [];
            for await (const [, handle] of dir.entries()) {
              if (handle.kind === "file" && handle.name.toLowerCase().endsWith(".pdf")) {
                files.push(await handle.getFile());
              }
            }
            await runQueue(files);
            return;
          } catch (e) {
            if (e instanceof Error && e.name === "AbortError") {
              setStatus(STATUS_IDLE);
              return;
            }
            console.warn(e);
            setStatus("Wybór folderu (File System Access) nie zadziałał — otwieram okno folderu…");
          }
        }
        el.inputDir.click();
      });

      el.inputDir.addEventListener("change", async () => {
        const list = el.inputDir.files ? Array.from(el.inputDir.files) : [];
        el.inputDir.value = "";
        const pdfs = list.filter((f) => f.name.toLowerCase().endsWith(".pdf"));
        if (list.length > 0 && pdfs.length === 0) {
          setStatus("W wybranym folderze nie znaleziono plików .pdf.");
          return;
        }
        await runQueue(pdfs);
      });
    </script>
  </body>
</html>
